name: Verify Tenday
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build:web
        env:
          EXPO_PUBLIC_CONVEX_URL: https://fleet-hedgehog-420.convex.cloud
          EXPO_PUBLIC_CONVEX_SITE_URL: https://fleet-hedgehog-420.convex.site
